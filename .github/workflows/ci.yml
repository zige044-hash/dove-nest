name: Dove Nest CI

on:
  push:
    branches:
      - feature/dove-nest-1.0
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dove-nest-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type check and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: dovenest-starter

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dovenest-starter/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
